name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --cov=shop --cov-report=term-missing --cov-fail-under=90

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image-Namen festlegen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Image bauen
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" --tag "$IMAGE" .
      - name: Image scannen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Bei GHCR anmelden
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image pushen
        run: docker push "$IMAGE"

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Image-Namen festlegen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: DB Secret and env
        run: echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }} DB_USER=${{ vars.DB_USER }}"
      - name: Bei GHCR anmelden
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke Test
        run: bash scripts/smoke-test.sh "$IMAGE"

  freigabe:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Freigabe erteilt für $GITHUB_SHA"

  produktion:
    needs: freigabe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: DB Secret and env
        run: echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }} DB_USER=${{ vars.DB_USER }}"
      - name: Image-Namen festlegen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Statusseite erzeugen
        run: bash scripts/statusseite.sh "$IMAGE"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
